name: Build PanVK Mali (Placed Memory Fix)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/panfrost/lib/kmod/kbase_kmod.c'
      - 'src/panfrost/vulkan/**'
      - '.github/workflows/build-panvk.yml'

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build pkg-config glslang-tools \
            python3-pip python3-mako python3-packaging python3-yaml \
            bison flex cmake libelf-dev libzstd-dev \
            clang-18 llvm-18-dev libclang-18-dev libclc-18-dev libllvmspirvlib-18-dev \
            zip
          python3 -m pip install --break-system-packages --upgrade "meson>=1.5.0"
          sudo ln -sf /usr/bin/llvm-config-18 /usr/local/bin/llvm-config
          meson --version

      - name: Build PanVK Android driver
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n1)
          fi
          echo "Using NDK: $NDK_PATH"
          chmod +x build.sh
          ./build.sh "$NDK_PATH"
          ls -lh dist/

      - name: Symbolicate crash offsets
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n1)
          fi
          BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SO="build-android/src/panfrost/vulkan/libvulkan_panfrost.so"
          {
            echo "=== addr2line (v3 e2ef838 offsets) ==="
            "$BIN/llvm-addr2line" -f -C -i -p -e "$SO" 0xd0fa0c 0xd0f7bc 0xde8cb8 0xde8c50 0xd0f9dc 0xd0f78c 0xde8c88
            echo ""
            echo "=== objdump around 0xd0fa0c ==="
            "$BIN/llvm-objdump" -d --start-address=0xd0f9d0 --stop-address=0xd0fa40 "$SO"
            echo ""
            echo "=== objdump around 0xd0f7bc ==="
            "$BIN/llvm-objdump" -d --start-address=0xd0f780 --stop-address=0xd0f7e0 "$SO"
          } | tee dist/crash-symbols.txt

      - name: Upload Driver ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanVK-Mali-PlacedFix
          path: |
            dist/*.zip
            dist/crash-symbols.txt
          if-no-files-found: error
